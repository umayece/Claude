services:
  db:
    image: postgres:16-alpine
    container_name: mke-crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm}
      POSTGRES_DB: crm
    volumes:
      - crm-db-data:/var/lib/postgresql/data
    healthcheck:
      # Backend, veritabanı gerçekten sorgu kabul edene kadar başlamamalı.
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    container_name: mke-crm-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD:-crm}@db:5432/crm?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      TRASH_RETENTION_DAYS: 30
      ENABLE_BACKGROUND_JOBS: "true"
      # Tanımsız bırakılırsa AI modülü yerel kural tabanlı motora düşer
      # ve hiçbir müşteri verisi dışarı çıkmaz.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
    # prisma/migrations klasörü varsa migration geçmişi uygulanır; yoksa
    # şema doğrudan veritabanına yazılır. `migrate deploy` boş bir geçmişte
    # hiçbir tablo oluşturmadan başarıyla çıkıyor, backend de ilk sorguda
    # "relation does not exist" ile ölüyordu. `db push` zaten senkron bir
    # veritabanında işlemsizdir, tekrar tekrar çalıştırmak güvenlidir.
    command: >
      sh -c "if [ -d prisma/migrations ]; then npx prisma migrate deploy;
      else npx prisma db push --skip-generate; fi && node dist/index.js"
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
    container_name: mke-crm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  crm-db-data:
