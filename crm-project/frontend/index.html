<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MKE A.Ş. Kurumsal Müşteri İlişkileri Yönetimi" />
    <meta name="theme-color" content="#0A192F" />

    <!--
      Kurumsal tipografi: başlık/metrik için Barlow Condensed, gövde için Inter.

      ÖNEMLİ — RENDER ENGELLEME: Normal bir `rel="stylesheet"` etiketi ilk
      boyamayı BLOKLAR. Kapalı veya yavaş ağda tarayıcı bu isteğin zaman
      aşımına uğramasını bekler ve giriş ekranı saniyelerce boş kalır.

      `media="print"` ile indirilen stil sayfası boyamayı engellemez;
      `onload` içinde `media="all"` yapılınca fontlar geldiği anda devreye
      girer. Böylece sayfa ANINDA sistem fontuyla açılır, font yüklenince
      sessizce geçiş yapar. JavaScript kapalıysa `<noscript>` yedeği eski
      davranışa döner.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null;"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <title>MKE CRM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
